<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Meta Heroes｜無料社内AIセミナー概要</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#171c22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}.load{text-align:center;padding:32px}.dot{width:12px;height:12px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,#31c6d8,#735be0);animation:p 1.2s ease-in-out infinite}@keyframes p{50%{transform:scale(1.4);opacity:.5}}p{color:#75818c;font-size:14px}</style></head><body><main class="load" id="loading"><div class="dot"></div><strong>Meta Heroes</strong><p>セミナー概要を読み込んでいます。</p></main><script>(async()=>{const files=["assets/site-01.txt","assets/site-02.txt","assets/site-03.txt","assets/site-04.txt","assets/site-05.txt"];try{const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+': '+r.status);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){console.error(e);document.getElementById('loading').innerHTML='<strong>読み込みに失敗しました</strong><p>ページを再読み込みしてください。</p>'}})()</script></body></html>
