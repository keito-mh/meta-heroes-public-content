<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>Meta Heroes｜無料社内AIセミナー</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#171c22;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
    .loader{text-align:center;padding:32px}
    .dot{width:12px;height:12px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#32c6d9,#6d5bd6);animation:p 1.2s ease-in-out infinite}
    @keyframes p{50%{transform:scale(1.45);opacity:.55}}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#75818c;font-size:14px;line-height:1.7;margin:0}
  </style>
</head>
<body>
  <main class="loader" id="loading">
    <div class="dot"></div>
    <h1>Meta Heroes</h1>
    <p>提案ページを読み込んでいます。</p>
  </main>
  <script>
    (async()=>{
      const files=[
        'assets/site-01.txt',
        'assets/site-02.txt',
        'assets/site-03.txt',
        'assets/site-04.txt',
        'assets/site-05a.txt',
        'assets/site-05b.txt',
        'assets/site-05c.txt',
        'assets/site-06a.txt',
        'assets/site-06b.txt'
      ];
      const theme='\n<style id="reference-theme">\n:root{\n  --navy:#151b22;\n  --navy2:#222b35;\n  --cyan:#32c6d9;\n  --blue:#3aa6ea;\n  --purple:#6d5bd6;\n  --pink:#7a63dd;\n  --white:#ffffff;\n  --text:#171c22;\n  --muted:#66727f;\n  --bg:#ffffff;\n  --line:#e4ebf0;\n}\nhtml,body{background:#fff!important;color:var(--text)!important}\nbody{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif!important;letter-spacing:.01em}\n.wrap{width:min(1040px,100%)!important}\nsection{padding:104px 20px!important}\n.section-title{color:#171c22!important;font-size:clamp(30px,4.2vw,46px)!important;line-height:1.28!important;letter-spacing:-.035em!important;text-align:center!important;margin:0 auto 18px!important;max-width:820px}\n.section-lead{color:#707b86!important;max-width:760px!important;margin:0 auto 46px!important;text-align:center!important;font-size:16px!important;line-height:1.95!important}\n.card,.problem,.tab-panel,.agenda,.offer,.case-image-card,.case-content,.selfcase-image-card,.selfcase-content,.journey-card,.scene-card{border-color:#e5ecf1!important;box-shadow:0 8px 26px rgba(18,35,52,.045)!important}\n.hero{min-height:auto!important;background:radial-gradient(circle at 90% 8%,rgba(50,198,217,.08),transparent 25%),radial-gradient(circle at 10% 88%,rgba(109,91,214,.07),transparent 24%),#ffffff!important;color:#171c22!important;padding:72px 20px 112px!important;border-bottom:1px solid #eef2f5}\n.hero::before,.hero::after{border-color:rgba(32,49,65,.06)!important;opacity:.55}\n.brand{color:#151b22!important;margin-bottom:42px!important;font-size:14px!important}.brand-dot{width:11px!important;height:11px!important;box-shadow:none!important;background:linear-gradient(135deg,var(--cyan),var(--purple))!important}\n.badge,.story-kicker,.case-label,.selfcase-label{background:#f4f8fa!important;color:#4e5f6e!important;border:1px solid #e2eaef!important;backdrop-filter:none!important;box-shadow:none!important}\n.hero h1{color:#131820!important;max-width:820px!important;font-size:clamp(42px,6vw,70px)!important;line-height:1.16!important;letter-spacing:-.055em!important;margin:24px 0 24px!important}\n.gradient-text{background:none!important;color:#131820!important;-webkit-text-fill-color:#131820!important}\n.hero p{color:#626f7b!important;max-width:760px!important;font-size:clamp(16px,1.7vw,19px)!important;line-height:2!important}.hero-note{color:#8a96a1!important}.orb{opacity:.2!important;box-shadow:none!important}\n.btn{border-radius:999px!important;min-height:52px;padding:14px 26px!important;font-size:14px!important;font-weight:800!important;box-shadow:none!important}.btn-primary{background:#151b22!important;color:#fff!important}.btn-primary:hover{background:#252d36!important;transform:translateY(-2px)}.btn-ghost{background:#fff!important;color:#26313b!important;border:1px solid #dce5eb!important}\n.dark,.scroll-story,.case-section,.selfcase-section,.cta-section{background:#f7fafc!important;color:#171c22!important}section[style]{background:#f7fafc!important}.dark .section-lead,.story-lead,.cta-section p{color:#707b86!important}.story-title{color:#171c22!important}.story-kicker{color:#4f626f!important}.scroll-story{background:linear-gradient(180deg,#f7fafc 0%,#ffffff 100%)!important;border-top:1px solid #edf2f5;border-bottom:1px solid #edf2f5}.story-shell{padding:104px 20px!important}.story-track{gap:16px!important}\n.card,.problem,.tab-panel,.journey-card,.scene-card,.case-image-card,.case-content,.selfcase-image-card,.selfcase-content{background:#fff!important;color:#171c22!important;border-radius:16px!important}.problem-list{gap:12px!important}.problem{background:#f9fbfc!important;padding:22px!important}.problem strong{color:#1d252d!important}.problem span{color:#6f7b87!important}.check{background:#151b22!important;color:#fff!important;box-shadow:none!important}.icon{background:#f1f6f8!important;color:#202a33!important;border-radius:12px!important}\n.flow{margin-top:52px!important}.flow::before{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple))!important;opacity:.8!important}.step-num{background:#fff!important;color:#1a222a!important;border:2px solid #dce8ee!important;box-shadow:0 0 0 8px #f7fafc!important}.step h4{color:#1a222a!important}.step p{color:#73808c!important}\n.tabs{max-width:820px;margin:30px auto 22px!important;gap:10px!important;justify-content:center}.tab{background:#f7fafc!important;border:1px solid #e3eaf0!important;color:#44515d!important;min-width:180px}#tab-sales:checked ~ .tabs label[for="tab-sales"],#tab-admin:checked ~ .tabs label[for="tab-admin"],#tab-manager:checked ~ .tabs label[for="tab-manager"]{color:#fff!important;border-color:transparent!important;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple))!important}.tab-panels{max-width:820px;margin:0 auto}.tab-panel{background:#fff!important;border-radius:16px!important;padding:28px!important}.tab-panel h3{color:#19212a!important}.tab-panel li{color:#596673!important}\n.scene-card{min-height:480px!important}.scene-top{background:linear-gradient(145deg,#eef5f8,#f9fbfc)!important;border-bottom:1px solid #edf2f5}.scene-copy{padding:24px!important}.scene-copy h3{color:#171c22!important}.scene-copy p{color:#6f7b86!important}.scene-num{color:#596875!important}.desk{background:#dce9ef!important;border-color:#cfdee6!important}.data-chip{background:#fff!important;border-color:#dce8ee!important;color:#44535f!important;box-shadow:0 6px 20px rgba(18,35,52,.05)}.ai-ring{box-shadow:none!important;background:radial-gradient(circle at center,#fff 0 35%,transparent 36%),conic-gradient(from 0deg,var(--cyan),var(--blue),var(--purple),var(--cyan))!important}.ai-ring::after{background:#fff!important;color:#202832!important;border:1px solid #e2eaf0}.dashboard-mini{box-shadow:0 14px 30px rgba(18,35,52,.08)!important}.done-badge{box-shadow:none!important}\n.journey{background:#fff!important}.journey-head{margin-left:auto!important;margin-right:auto!important;text-align:center}.journey-banner{background:#f5f9fb!important;color:#171c22!important;border:1px solid #e3ebf0!important;border-radius:16px!important}.journey-banner h3{color:#171c22!important}.journey-banner p{color:#6d7985!important}.scan-visual{background:#fff!important;border-color:#e0e9ef!important}.journey-card::before{opacity:.45}.journey-card h4{color:#171c22!important}.journey-card p{color:#6f7a86!important}.mini-flow span{background:#f6f9fb!important;border-color:#e2eaf0!important;color:#4c5d6c!important}\n.agenda{max-width:880px;margin:0 auto;border-radius:16px!important}.agenda-time{background:#f5f9fb!important;color:#26343f!important}.agenda-content strong{color:#171c22!important}.agenda-content span{color:#707d89!important}.agenda::after{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple))!important;height:3px!important}\n.result-box{max-width:960px;margin:0 auto;background:#fff!important;color:#171c22!important;border:1px solid #e4ebf0!important;border-radius:18px!important;box-shadow:0 8px 28px rgba(18,35,52,.05)!important}.result-box h3{color:#171c22!important}.result-box p{color:#6c7884!important}.result-pill{background:#f6f9fb!important;border-color:#e4ebf0!important;color:#394754!important;border-radius:12px!important}.quote{background:#fff!important;color:#161b21!important;padding:72px 20px!important}.quote span{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent!important}\n.case-section,.selfcase-section{border-top:1px solid #eef2f5}.case-wrap,.selfcase-wrap{gap:20px!important}.case-image-card,.selfcase-image-card{border-radius:16px!important}.case-content,.selfcase-content{padding:30px!important;border-radius:16px!important;background:#fff!important;color:#171c22!important}.case-content h3,.selfcase-content h3{color:#171c22!important}.case-content p,.selfcase-content p{color:#697682!important}.case-point{background:#f8fafb!important;border-color:#e5ecf1!important;border-radius:12px!important}.case-point strong{color:#263542!important}.case-point span{color:#667482!important}.case-flow span{background:#f5f8fa!important;border-color:#e2e9ee!important;color:#455562!important}.selfcase-point{background:#f8fafb!important;border:1px solid #e5ecf1!important;border-radius:12px!important}.selfcase-point strong{color:#24333f!important}.selfcase-point span{color:#667482!important}.selfcase-flow span{background:#f5f8fa!important;border:1px solid #e2e9ee!important;color:#455562!important}.selfcase-route{background:#f7fafc!important;border:1px solid #e3ebf0!important}.selfcase-route-title{color:#26333f!important}.selfcase-route-box{background:#fff!important;border-color:#e2eaf0!important;color:#4a5966!important}.selfcase-route-center{background:linear-gradient(135deg,#e6fbfd,#eef6ff,#f0edff)!important;border-color:#dce8ef!important}.selfcase-route-center strong{color:#1d2730!important}.selfcase-route-center span{color:#5f6f7d!important}.selfcase-note{color:#75828e!important}.case-caption,.selfcase-caption{background:#fbfcfd!important;color:#7a8792!important}\n.offer{max-width:920px;margin:0 auto;background:#fff!important;border:1px solid #e4ebf0!important;border-radius:18px!important;box-shadow:none!important}.offer h3{color:#171c22!important;text-align:center}.offer p{color:#6e7a86!important;text-align:center}.offer-meta{justify-content:center!important}.meta{background:#f6f9fb!important;border-color:#e2eaf0!important;color:#44525e!important;border-radius:999px!important}.cta-section{background:#f5fafc!important;color:#171c22!important;border-top:1px solid #edf2f5}.cta-section .section-title{color:#171c22!important}.cta-section .btn-primary{background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple))!important;color:#fff!important;min-width:280px}.small-note{color:#86929d!important}footer{background:#fff!important;color:#89949e!important;border-top:1px solid #edf2f5;padding:40px 20px!important}.motion-item,.reveal{will-change:transform,opacity}.journey-card::before,.offer::before{opacity:.32!important}\n@media(max-width:800px){section{padding:76px 18px!important}.hero{padding:48px 18px 78px!important}.brand{margin-bottom:28px!important}.hero h1{font-size:clamp(36px,10.7vw,48px)!important;line-height:1.2!important;letter-spacing:-.045em!important}.hero p{font-size:16px!important;line-height:1.9!important}.section-title{font-size:30px!important;line-height:1.34!important;text-align:left!important}.section-lead{text-align:left!important;margin-bottom:32px!important}.story-title{font-size:32px!important;line-height:1.3!important;text-align:left!important}.story-lead{text-align:left!important}.cta-row{grid-template-columns:1fr!important}.btn{width:100%!important}.problem-list,.story-track,.case-wrap,.selfcase-wrap{gap:12px!important}.tab{width:100%!important;min-width:0!important;justify-content:flex-start!important}#tab-sales:checked ~ .tabs label[for="tab-sales"],#tab-admin:checked ~ .tabs label[for="tab-admin"],#tab-manager:checked ~ .tabs label[for="tab-manager"]{justify-content:flex-start!important}.scene-card{min-height:auto!important}.scene-top{min-height:220px!important}.journey-banner,.journey-card,.case-content,.selfcase-content,.result-box,.offer{padding:22px!important}.quote{padding:56px 18px!important;text-align:left!important}.offer h3,.offer p{text-align:left!important}.offer-meta{justify-content:flex-start!important}.cta-section{text-align:left!important}.cta-section p{margin-left:0!important;margin-right:0!important}}\n</style>\n'.slice(1,-1);
      try{
        const parts=await Promise.all(files.map(async(file)=>{
          const response=await fetch(file,{cache:'no-store'});
          if(!response.ok) throw new Error(`${file}: ${response.status}`);
          return response.text();
        }));
        let page=parts.join('');
        page=page.replace('</head>',theme+'</head>');
        document.open();
        document.write(page);
        document.close();
      }catch(error){
        console.error(error);
        document.getElementById('loading').innerHTML='<h1>読み込みに失敗しました</h1><p>時間をおいてページを再読み込みしてください。</p>';
      }
    })();
  </script>
</body>
</html>
