<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Meta Heroes｜無料社内AIセミナー</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08162f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}.loader{text-align:center;padding:32px}.dot{width:14px;height:14px;margin:0 auto 18px;border-radius:50%;background:#11cacb;box-shadow:0 0 24px rgba(17,202,203,.7);animation:p 1.2s ease-in-out infinite}@keyframes p{50%{transform:scale(1.45);opacity:.55}}h1{font-size:20px;margin:0 0 8px}p{color:#a9bad0;font-size:14px;line-height:1.7;margin:0}
  </style>
</head>
<body>
  <main class="loader" id="loading">
    <div class="dot"></div>
    <h1>Meta Heroes</h1>
    <p>提案ページを読み込んでいます。</p>
  </main>
  <script>
    (async()=>{
      const files=[
        'assets/site-01.txt',
        'assets/site-02.txt',
        'assets/site-03.txt',
        'assets/site-04.txt',
        'assets/site-05a.txt',
        'assets/site-05b.txt',
        'assets/site-05c.txt',
        'assets/site-06a.txt',
        'assets/site-06b.txt'
      ];
      try{
        const parts=await Promise.all(files.map(async(file)=>{
          const response=await fetch(file,{cache:'no-store'});
          if(!response.ok) throw new Error(`${file}: ${response.status}`);
          return response.text();
        }));
        document.open();
        document.write(parts.join(''));
        document.close();
      }catch(error){
        console.error(error);
        document.getElementById('loading').innerHTML='<h1>読み込みに失敗しました</h1><p>時間をおいてページを再読み込みしてください。</p>';
      }
    })();
  </script>
</body>
</html>
